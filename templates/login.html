<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMPG · Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1117;
            --paper: #f7f4ef;
            --rust: #c84b2f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }

        .logo {
            font-family: 'Instrument Serif', serif;
            font-size: 32px;
            margin-bottom: 24px;
        }

        .logo span {
            color: var(--rust);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        p {
            font-size: 16px;
            color: #7a7265;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--rust);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #9e3820;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Auto<span>MPG</span></div>
        <h1>Welcome to AutoMPG</h1>
        <p>Predict vehicle fuel efficiency with our advanced ML model. No authentication required—start predicting right away!</p>
        <a href="/" class="btn">Get Started</a>
    </div>
</body>
</html>
